<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tricoci Admissions — Clickable Journey Prototype</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;900&display=swap');

  :root{
    --ink:#1F1F1F; --paper:#FFFFFF; --paper-2:#F5F5F5; --card:#FFFFFF;
    --terracotta:#91C236; --terracotta-2:#5E7D22; --terracotta-tint:#EAF5D9;
    --navy:#111111; --sage:#6B6B6B;
    --line:rgba(31,31,31,0.12); --line-strong:rgba(31,31,31,0.24);
    --shadow-soft:0 8px 20px -14px rgba(31,31,31,0.25);
  }
  *{box-sizing:border-box;}
  html,body{height:100%;margin:0;}
  body{
    background:radial-gradient(circle at 50% 20%, #2a2a2a, #0a0a0a);
    font-family:'Poppins',sans-serif;color:var(--ink);
    display:flex;align-items:center;justify-content:center;min-height:100vh;padding:30px 12px;
  }

  /* ---------- iPhone 16 Pro frame ---------- */
  .device{
    position:relative;width:402px;height:860px;background:linear-gradient(160deg,#3a3a3c,#1c1c1e 40%,#3a3a3c);
    border-radius:62px;padding:12px;box-shadow:0 40px 80px -20px rgba(0,0,0,0.7), inset 0 0 0 2px rgba(255,255,255,0.08);
    flex-shrink:0;
  }
  .device::before{ /* side buttons */
    content:"";position:absolute;left:-3px;top:150px;width:3px;height:32px;background:#111;border-radius:2px 0 0 2px;
    box-shadow:0 90px 0 #111, 0 150px 0 #111;
  }
  .device::after{
    content:"";position:absolute;right:-3px;top:220px;width:3px;height:70px;background:#111;border-radius:0 2px 2px 0;
  }
  .screen{
    position:relative;width:100%;height:100%;background:var(--paper);border-radius:50px;overflow:hidden;
    display:flex;flex-direction:column;
  }
  .dynamic-island{
    position:absolute;top:14px;left:50%;transform:translateX(-50%);width:100px;height:28px;
    background:#000;border-radius:20px;z-index:50;
  }
  .statusbar{
    height:48px;flex-shrink:0;display:flex;align-items:flex-end;justify-content:space-between;
    padding:0 26px 6px;font-size:14px;font-weight:600;color:var(--ink);
  }
  .statusbar .icons{display:flex;gap:4px;align-items:center;font-size:12px;}

  /* ---------- progress: visible, NOT clickable, only earned by completing steps ---------- */
  .progress-row{display:flex;gap:6px;padding:6px 20px 12px;flex-shrink:0;}
  .progress-seg{flex:1;height:4px;border-radius:999px;background:var(--line);overflow:hidden;}
  .progress-seg .fill{height:100%;width:0%;background:var(--terracotta);border-radius:999px;transition:width .4s ease;}
  .progress-seg.done .fill{width:100%;}
  .progress-seg.current .fill{width:55%;}
  .progress-label{padding:0 20px 10px;font-size:11px;font-weight:700;color:var(--sage);text-transform:uppercase;letter-spacing:0.04em;}

  /* ---------- app content: one stage screen, scrollable ---------- */
  .app-content{flex:1;overflow-y:auto;padding:6px 20px 16px;}
  .stage-screen{animation:screen-in .28s cubic-bezier(.34,1.05,.64,1);}
  @keyframes screen-in{from{opacity:0;transform:translateX(14px);}to{opacity:1;transform:translateX(0);}}

  .eyebrow{font-size:11px;font-weight:700;color:var(--terracotta-2);text-transform:uppercase;letter-spacing:0.05em;margin-bottom:6px;}
  .headline{font-weight:700;font-size:20px;line-height:1.3;margin-bottom:8px;}
  .subtext{font-size:13.5px;color:var(--sage);line-height:1.5;margin-bottom:16px;}

  /* video/counsellor module */
  .video-card{position:relative;width:100%;aspect-ratio:4/3;border-radius:18px;overflow:hidden;
    background:linear-gradient(145deg,#E8874A,var(--terracotta));margin-bottom:14px;cursor:pointer;box-shadow:var(--shadow-soft);}
  .video-card .playbtn{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:56px;height:56px;
    border-radius:50%;background:rgba(255,255,255,0.94);display:flex;align-items:center;justify-content:center;}
  .video-card .playbtn::after{content:"";border-style:solid;border-width:9px 0 9px 15px;
    border-color:transparent transparent transparent var(--navy);margin-left:4px;}
  .video-card .vcaption{position:absolute;bottom:0;left:0;right:0;padding:12px 14px;
    background:linear-gradient(0deg,rgba(0,0,0,0.65),transparent);color:#fff;}
  .video-card .vcaption b{display:block;font-size:14px;font-weight:700;}
  .video-card .vcaption span{font-size:11.5px;opacity:.85;}
  .video-note{font-size:11.5px;color:var(--sage);background:var(--paper-2);border-radius:10px;padding:9px 11px;margin-bottom:16px;}

  /* recommended program card */
  .rec-card{background:var(--terracotta-tint);border:1px solid var(--terracotta);border-radius:16px;padding:16px;margin-bottom:16px;}
  .rec-card .rname{font-weight:700;font-size:16px;margin-bottom:4px;}
  .rec-card .rreason{font-size:12.5px;color:var(--ink);}

  /* form */
  .field{margin-bottom:12px;}
  .field label{display:block;font-size:11.5px;font-weight:700;margin-bottom:5px;color:var(--sage);}
  .field input, .field select{width:100%;padding:12px;border:1px solid var(--line-strong);border-radius:10px;
    font-family:'Poppins',sans-serif;font-size:16px;background:var(--paper-2);color:var(--ink);}
  .field input:focus, .field select:focus{outline:none;border-color:var(--terracotta);}
  .assist-note{font-size:11.5px;color:var(--terracotta-2);background:var(--terracotta-tint);border-radius:8px;padding:7px 10px;margin-bottom:14px;}

  /* upload zone */
  .upload-zone{border:2px dashed var(--line-strong);border-radius:14px;padding:20px 14px;text-align:center;
    background:var(--paper-2);cursor:pointer;margin-bottom:12px;position:relative;overflow:hidden;}
  .upload-zone .uicon{font-size:22px;margin-bottom:4px;}
  .upload-zone .utext{font-size:12.5px;font-weight:600;}
  .upload-zone input[type="file"]{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;}
  .doc-row{display:flex;align-items:center;gap:9px;padding:9px 11px;background:var(--card);border:1px solid var(--line);
    border-radius:10px;font-size:12.5px;margin-bottom:6px;}
  .doc-row.received{background:var(--terracotta-tint);border-color:var(--terracotta);}
  .doc-dot{width:15px;height:15px;border-radius:50%;border:1.5px solid var(--line-strong);flex-shrink:0;position:relative;}
  .doc-row.received .doc-dot{background:var(--terracotta);border-color:var(--terracotta);}
  .doc-row.received .doc-dot::after{content:"\2713";position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:9px;color:#fff;}

  /* celebration */
  .celebrate-card{background:linear-gradient(160deg,var(--terracotta-tint),var(--paper));border:1px solid var(--terracotta);
    border-radius:16px;padding:20px 16px;text-align:center;margin-bottom:16px;}
  .celebrate-card .ctitle{font-weight:700;font-size:18px;margin-bottom:6px;}

  /* time slot picker */
  .slot-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;}
  .slot-chip{border:1px solid var(--line-strong);border-radius:999px;padding:10px 14px;font-size:12.5px;font-weight:600;cursor:pointer;}
  .slot-chip.selected{background:var(--terracotta);border-color:transparent;}
  .confirm-note{display:none;font-size:12.5px;color:var(--terracotta-2);font-weight:600;background:var(--terracotta-tint);
    border-radius:10px;padding:10px 12px;margin-bottom:14px;}
  .confirm-note.show{display:block;}

  /* collapsed content — the "save real estate" layer, expands in place */
  .more-title{font-size:12px;font-weight:700;color:var(--sage);text-transform:uppercase;letter-spacing:0.04em;margin:18px 0 8px;}
  .acc{border:1px solid var(--line);border-radius:12px;margin-bottom:8px;overflow:hidden;}
  .acc-head{padding:12px 14px;display:flex;align-items:center;justify-content:space-between;cursor:pointer;font-size:13px;font-weight:600;background:var(--card);}
  .acc-head .chev{color:var(--sage);transition:transform .18s ease;font-size:16px;}
  .acc.open .acc-head .chev{transform:rotate(90deg);}
  .acc-body{max-height:0;overflow:hidden;transition:max-height .25s ease;background:var(--paper-2);}
  .acc.open .acc-body{max-height:220px;}
  .acc-body-inner{padding:4px 14px 14px;font-size:12.5px;color:var(--ink);line-height:1.5;}

  .home-cta-block{margin-bottom:16px;}
  .action-btn{width:100%;padding:14px;font-size:14px;background:var(--navy);color:#fff;border:none;border-radius:999px;
    font-family:'Poppins',sans-serif;font-weight:700;cursor:pointer;box-shadow:var(--shadow-soft);
    transition:opacity .15s ease, transform .1s ease;}
  .action-btn:active{transform:scale(.98);}
  .action-btn:disabled{opacity:.35;cursor:not-allowed;}
  .action-sub{text-align:center;font-size:10.5px;color:var(--sage);margin-top:6px;}

  /* ---------- persistent tab bar: the actual front-desk navigation, CTA merged in ---------- */
  .tab-bar{flex-shrink:0;display:flex;align-items:flex-end;border-top:1px solid var(--line);background:var(--paper);
    padding:8px 10px calc(8px + env(safe-area-inset-bottom));gap:8px;}
  .tab-btn{flex:1;width:100%;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 4px 4px;
    background:none;border:none;cursor:pointer;color:var(--sage);}
  .tab-btn svg{stroke:var(--sage);}
  .tab-btn .tlabel{font-size:10px;font-weight:600;}
  .tab-btn.active{color:var(--terracotta-2);}
  .tab-btn.active svg{stroke:var(--terracotta-2);}
  .tab-dot{position:absolute;top:2px;right:22%;width:7px;height:7px;border-radius:50%;background:var(--terracotta);
    border:1.5px solid var(--paper);}
  .tab-btn-wrap{position:relative;flex:1;}
  .nav-cta-wrap{flex:1;}
  .nav-cta-btn{width:100%;background:none;border:none;cursor:pointer;color:var(--terracotta-2);
    display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 4px 4px;}
  .nav-cta-btn svg{stroke:var(--terracotta-2);}
  .nav-cta-btn .tlabel{font-size:10px;font-weight:600;}
  .nav-cta-btn:disabled{color:var(--sage);cursor:not-allowed;}
  .nav-cta-btn:disabled svg{stroke:var(--sage);}

  /* ---------- Home tab: the front desk, stitched into one canvas ---------- */
  .counsellor-block{margin-bottom:16px;}
  .counsellor-block .cb-head{display:flex;gap:10px;align-items:center;margin-bottom:10px;}
  .counsellor-block .cb-avatar{width:38px;height:38px;border-radius:50%;background:var(--navy);color:#fff;
    display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;flex-shrink:0;}
  .counsellor-block .cb-name{font-weight:700;font-size:14px;}
  .counsellor-block .cb-role{font-size:10.5px;color:var(--sage);}
  .cb-video{position:relative;width:100%;aspect-ratio:21/9;border-radius:14px;overflow:hidden;cursor:pointer;
    background:linear-gradient(145deg,#E8874A,var(--terracotta));margin-bottom:8px;}
  .cb-video .playbtn{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:44px;height:44px;
    border-radius:50%;background:rgba(255,255,255,0.94);display:flex;align-items:center;justify-content:center;}
  .cb-video .playbtn::after{content:"";border-style:solid;border-width:7px 0 7px 12px;
    border-color:transparent transparent transparent var(--navy);margin-left:3px;}
  .cb-video .cb-caption{position:absolute;bottom:0;left:0;right:0;padding:9px 12px;font-size:11px;color:#fff;
    background:linear-gradient(0deg,rgba(0,0,0,0.6),transparent);}
  .cb-voice-btn{width:100%;border:1px solid var(--line-strong);background:var(--card);border-radius:999px;
    padding:9px;font-size:11.5px;font-weight:700;cursor:pointer;color:var(--ink);}

  .stage-block{background:var(--paper-2);border-radius:16px;padding:14px;margin-bottom:14px;}
  .sb-title{font-weight:700;font-size:13.5px;margin-bottom:8px;}
  .sb-body{font-size:12px;color:var(--sage);}
  .program-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
  .program-card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:11px;cursor:pointer;}
  .pc-name{font-weight:700;font-size:12.5px;}
  .pc-blurb{font-size:10.5px;color:var(--sage);margin-top:2px;}

  .teaser-row{display:flex;gap:8px;overflow-x:auto;margin:0 -20px 14px;padding:0 20px 4px;-webkit-overflow-scrolling:touch;}
  .teaser-row::-webkit-scrollbar{display:none;}
  .teaser-chip{flex-shrink:0;border:1px solid var(--line-strong);background:var(--card);border-radius:999px;
    padding:9px 14px;font-size:12px;font-weight:600;cursor:pointer;white-space:nowrap;}
  .teaser-chip.seen{background:var(--terracotta-tint);border-color:transparent;color:var(--terracotta-2);}

  .output-block{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:14px;
    min-height:80px;transition:opacity .2s ease;}
  .output-empty{font-size:12px;color:var(--sage);text-align:center;padding:14px 0;}
  .output-eyebrow{font-size:10.5px;font-weight:700;color:var(--terracotta-2);text-transform:uppercase;letter-spacing:0.05em;margin-bottom:5px;}
  .output-title{font-weight:700;font-size:14px;margin-bottom:6px;}
  .output-body{font-size:12.5px;color:var(--ink);line-height:1.5;}

  /* rich output types: event (BTL session), video (live experiment), community */
  .event-card{background:var(--paper-2);border-radius:12px;padding:12px;margin-top:2px;}
  .event-when{font-size:10.5px;font-weight:700;color:var(--terracotta-2);text-transform:uppercase;letter-spacing:0.04em;}
  .event-title{font-weight:700;font-size:14px;margin:3px 0 4px;}
  .event-where{font-size:11.5px;color:var(--sage);margin-bottom:8px;}
  .event-body{font-size:12px;color:var(--ink);margin-bottom:10px;line-height:1.4;}
  .event-rsvp{width:100%;background:var(--navy);color:#fff;border:none;border-radius:999px;padding:10px;
    font-family:'Poppins',sans-serif;font-weight:700;font-size:12.5px;cursor:pointer;}
  .event-rsvp.done{background:var(--terracotta);color:var(--ink);}
  .community-row{display:flex;align-items:center;gap:10px;margin-bottom:8px;}
  .community-avatars{display:flex;}
  .community-avatars span{width:26px;height:26px;border-radius:50%;border:2px solid var(--card);margin-left:-8px;
    background:linear-gradient(135deg,var(--terracotta),#E8874A);}
  .community-avatars span:first-child{margin-left:0;background:linear-gradient(135deg,var(--navy),#333);}
  .community-avatars span:nth-child(2){background:linear-gradient(135deg,#5b7fbd,#3a5580);}
  .community-count{font-size:12px;font-weight:700;}
  .social-card{border:1px solid var(--line);border-radius:12px;overflow:hidden;}
  .social-head{display:flex;align-items:center;gap:8px;padding:9px 11px;border-bottom:1px solid var(--line);}
  .social-head .shandle{font-size:11.5px;font-weight:700;}
  .social-head .ssource{font-size:9px;color:var(--sage);margin-left:auto;background:var(--paper-2);padding:3px 7px;border-radius:999px;}
  .social-photo{width:100%;aspect-ratio:1.6;background:linear-gradient(135deg,#c15b8e,#8a3b60);}
  .social-caption{padding:9px 11px;font-size:11.5px;line-height:1.4;color:var(--ink);}

  /* ---------- floating chat: icon + compact popup, not embedded in the scroll flow ---------- */
  .chat-fab{position:absolute;right:16px;bottom:76px;width:50px;height:50px;border-radius:50%;background:var(--navy);
    color:#fff;border:none;display:flex;align-items:center;justify-content:center;box-shadow:var(--shadow-med);
    cursor:pointer;z-index:60;transition:transform .15s ease;}
  .chat-fab:active{transform:scale(.94);}
  .chat-fab .dot{position:absolute;top:6px;right:6px;width:9px;height:9px;border-radius:50%;background:var(--terracotta);
    border:2px solid var(--navy);display:none;}
  .chat-fab .dot.show{display:block;}
  .chat-popup{position:absolute;right:14px;bottom:134px;width:290px;max-height:480px;background:var(--card);
    border-radius:16px;box-shadow:var(--shadow-med);z-index:59;display:flex;flex-direction:column;overflow:hidden;
    transform:translateY(12px) scale(.96);opacity:0;pointer-events:none;transition:transform .18s ease, opacity .18s ease;}
  .chat-popup.open{transform:translateY(0) scale(1);opacity:1;pointer-events:auto;}
  .cp-head{background:var(--navy);color:#fff;padding:10px 12px;font-size:12px;font-weight:700;
    display:flex;align-items:center;justify-content:space-between;flex-shrink:0;}
  .cp-head .cp-close{cursor:pointer;font-size:15px;opacity:.8;}
  .cp-call{cursor:pointer;display:flex;align-items:center;opacity:.9;}
  .cp-msgs{flex:1;overflow-y:auto;padding:10px 12px;display:flex;flex-direction:column;gap:6px;min-height:320px;max-height:380px;}
  .mc-msg{max-width:85%;padding:7px 11px;border-radius:12px;font-size:11.5px;line-height:1.4;}
  .mc-msg.bot{background:var(--paper-2);align-self:flex-start;}
  .mc-msg.user{background:var(--terracotta);align-self:flex-end;}
  .cp-input-row{display:flex;gap:6px;padding:9px 10px;border-top:1px solid var(--line);flex-shrink:0;}
  .cp-input-row input{flex:1;border:1px solid var(--line-strong);border-radius:999px;padding:8px 12px;
    font-size:16px;font-family:'Poppins',sans-serif;background:var(--paper-2);min-width:0;}
  .cp-input-row button{border:none;background:var(--navy);color:#fff;border-radius:999px;padding:8px 13px;
    font-weight:700;font-size:11px;cursor:pointer;flex-shrink:0;}

  .feed-item{display:flex;gap:10px;padding:11px 0;border-bottom:1px solid var(--line);}
  .feed-item:last-child{border-bottom:none;}
  .feed-item .ficon{width:28px;height:28px;border-radius:50%;background:var(--terracotta-tint);color:var(--terracotta-2);
    display:flex;align-items:center;justify-content:center;font-size:12px;flex-shrink:0;}
  .feed-item .ftext{font-size:12px;line-height:1.4;}
  .feed-item .ftime{font-size:10px;color:var(--sage);margin-top:2px;}
  .feed-empty{font-size:12px;color:var(--sage);text-align:center;padding:12px 0;}

  /* ---------- Resources tab ---------- */
  .res-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:8px;}
  .res-card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 12px;cursor:pointer;}
  .res-card .ricon{font-size:18px;margin-bottom:6px;}
  .res-card .rtitle{font-size:12px;font-weight:700;}

  /* ---------- Messages tab (was overlay, now inline) ---------- */
  .messages-tab{display:flex;flex-direction:column;height:100%;}
  .messages-tab .chat-msgs{flex:1;}

  /* ---------- testimonial slider: swipeable, not text buried in an accordion ---------- */
  .slider{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;margin:0 -20px 10px;padding:0 20px 6px;
    -webkit-overflow-scrolling:touch;}
  .slider::-webkit-scrollbar{display:none;}
  .t-card{flex:0 0 82%;scroll-snap-align:start;background:var(--card);border:1px solid var(--line);border-radius:16px;
    padding:14px;box-shadow:var(--shadow-soft);}
  .t-card .tquote{font-size:12.5px;font-style:italic;line-height:1.5;margin-bottom:8px;}
  .t-card .tby{display:flex;align-items:center;gap:8px;}
  .t-card .tavatar{width:28px;height:28px;border-radius:50%;background:linear-gradient(135deg,var(--terracotta),#E8874A);flex-shrink:0;}
  .t-card .tname{font-size:11.5px;font-weight:700;}
  .t-card .trole{font-size:10.5px;color:var(--sage);}
  .dots{display:flex;justify-content:center;gap:5px;margin:2px 0 16px;}
  .dot{width:5px;height:5px;border-radius:50%;background:var(--line-strong);}
  .dot.active{background:var(--terracotta);width:14px;border-radius:999px;}

  /* ---------- image gallery: swipeable photo strip ---------- */
  .gallery{display:flex;gap:8px;overflow-x:auto;scroll-snap-type:x mandatory;margin:0 -20px 16px;padding:0 20px 4px;
    -webkit-overflow-scrolling:touch;}
  .gallery::-webkit-scrollbar{display:none;}
  .g-item{flex:0 0 110px;scroll-snap-align:start;}
  .g-photo{width:110px;height:110px;border-radius:14px;position:relative;overflow:hidden;
    background:linear-gradient(135deg,var(--navy),#333);}
  .g-photo::after{content:"";position:absolute;inset:0;background-image:url("data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAyNCAyNCIgZmlsbD0ibm9uZSIgc3Ryb2tlPSJ3aGl0ZSIgc3Ryb2tlLXdpZHRoPSIxLjYiIHN0cm9rZS1saW5lY2FwPSJyb3VuZCIgc3Ryb2tlLWxpbmVqb2luPSJyb3VuZCI+PHJlY3QgeD0iMyIgeT0iNCIgd2lkdGg9IjE4IiBoZWlnaHQ9IjE2IiByeD0iMiIvPjxjaXJjbGUgY3g9IjguNSIgY3k9IjkuNSIgcj0iMS41Ii8+PHBhdGggZD0iTTIxIDE1bC01LTUtNCA0LTMtMy02IDYiLz48L3N2Zz4=");
    background-repeat:no-repeat;background-position:center;background-size:26px 26px;opacity:.35;}
  .g-label{font-size:10px;color:var(--sage);margin-top:5px;text-align:center;}
  .g-item:nth-child(2) .g-photo{background:linear-gradient(135deg,var(--terracotta),#E8874A);}

  /* ---------- infographic stat card ---------- */

  .stat-ring{--pct:0;width:64px;height:64px;border-radius:50%;flex-shrink:0;
    background:conic-gradient(var(--terracotta) calc(var(--pct)*1%), var(--line) 0);
    display:flex;align-items:center;justify-content:center;}
  .stat-ring-inner{width:50px;height:50px;border-radius:50%;background:var(--paper-2);display:flex;align-items:center;justify-content:center;
    font-weight:700;font-size:13px;}
  .infographic .stat-detail{flex:1;}
  .infographic .stat-title{font-size:12.5px;font-weight:700;margin-bottom:2px;}
  .infographic .stat-sub{font-size:11px;color:var(--sage);}
  .stat-badges{display:flex;gap:8px;margin-bottom:16px;}
  .stat-badge{flex:1;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 8px;text-align:center;}
  .stat-badge b{display:block;font-size:15px;font-weight:700;color:var(--terracotta-2);}
  .stat-badge span{font-size:9.5px;color:var(--sage);}

  /* video card variant for lab/program content */
  .video-card.small{aspect-ratio:16/9;margin-bottom:12px;}

  /* ---------- persistent chat: query resolution, always available via the Messages tab ---------- */
  .chat-panel{display:flex;flex-direction:column;height:100%;}
  .chat-head{flex-shrink:0;padding:14px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;}
  .chat-head .chead-info{display:flex;align-items:center;gap:10px;}
  .chat-head .chavatar{width:34px;height:34px;border-radius:50%;background:var(--navy);color:#fff;display:flex;
    align-items:center;justify-content:center;font-weight:700;font-size:13px;}
  .chat-head .cname{font-weight:700;font-size:13.5px;}
  .chat-head .cstatus{font-size:10.5px;color:var(--terracotta-2);}
  .chat-msgs{flex:1;overflow-y:auto;padding:14px 18px;display:flex;flex-direction:column;gap:9px;}
  .cmsg{max-width:80%;padding:9px 13px;border-radius:14px;font-size:13px;line-height:1.4;}
  .cmsg.bot{background:var(--paper-2);align-self:flex-start;border-bottom-left-radius:4px;}
  .cmsg.user{background:var(--terracotta);align-self:flex-end;border-bottom-right-radius:4px;}
  .cmsg.handoff{align-self:center;background:var(--terracotta-tint);border:1px solid var(--terracotta);text-align:center;font-weight:600;color:var(--terracotta-2);}
  .chat-quick{display:flex;gap:7px;padding:0 18px 10px;overflow-x:auto;flex-shrink:0;}
  .qchip{flex-shrink:0;border:1px solid var(--line-strong);border-radius:999px;padding:7px 12px;font-size:11.5px;font-weight:600;background:var(--card);cursor:pointer;white-space:nowrap;}
  .chat-input-row{flex-shrink:0;display:flex;gap:8px;padding:12px 18px 18px;border-top:1px solid var(--line);}
  .chat-input-row input{flex:1;border:1px solid var(--line);border-radius:999px;padding:10px 14px;font-size:16px;font-family:'Poppins',sans-serif;background:var(--paper-2);}
  .chat-input-row button{border:none;background:var(--navy);color:#fff;border-radius:999px;padding:10px 16px;font-weight:700;font-size:12.5px;cursor:pointer;}
  .callbar{flex-shrink:0;padding:0 18px 10px;}
  .callbtn{width:100%;border:1px solid var(--line-strong);background:var(--card);border-radius:999px;padding:9px;
    font-size:12px;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;}

  /* ---------- step tracker: process visualization, distinct from ring/gallery/slider ---------- */
  .steps-row{display:flex;align-items:flex-start;margin-bottom:18px;}
  .step-item{flex:1;display:flex;flex-direction:column;align-items:center;position:relative;}
  .step-dot{width:26px;height:26px;border-radius:50%;background:var(--line);display:flex;align-items:center;
    justify-content:center;font-size:12px;color:var(--sage);font-weight:700;z-index:1;}
  .step-item.done .step-dot{background:var(--terracotta);color:#fff;}
  .step-item.current .step-dot{background:var(--terracotta-2);color:#fff;box-shadow:0 0 0 4px var(--terracotta-tint);
    animation:pulse-step 1.4s infinite;}
  @keyframes pulse-step{0%,100%{box-shadow:0 0 0 4px var(--terracotta-tint);}50%{box-shadow:0 0 0 7px var(--terracotta-tint);}}
  .step-line{position:absolute;top:13px;left:-50%;width:100%;height:2px;background:var(--line);z-index:0;}
  .step-item.done .step-line{background:var(--terracotta);}
  .step-item:first-child .step-line{display:none;}
  .step-label{font-size:9px;color:var(--sage);text-align:center;margin-top:6px;line-height:1.3;}
  .step-item.current .step-label{color:var(--terracotta-2);font-weight:700;}

  /* single reassurance quote — lighter than a full slider, for content-heavy screens (e.g. a form) */
  .quote-mini{display:flex;gap:10px;align-items:center;background:var(--paper-2);border-radius:14px;padding:12px 14px;margin-bottom:16px;}
  .quote-mini .qavatar{width:30px;height:30px;border-radius:50%;background:linear-gradient(135deg,var(--terracotta),#E8874A);flex-shrink:0;}
  .quote-mini .qtext{font-size:12px;font-style:italic;line-height:1.4;}
  .quote-mini .qtext b{display:block;font-style:normal;font-weight:700;font-size:10.5px;margin-top:3px;color:var(--sage);}

  /* ---------- assistant narration: makes clear the assistant is choosing to show you this, not a static page ---------- */
  .assistant-note{display:flex;gap:10px;align-items:flex-start;background:var(--navy);color:#fff;border-radius:16px;
    border-bottom-left-radius:4px;padding:12px 14px;margin-bottom:16px;}
  .assistant-note .anavatar{width:26px;height:26px;border-radius:50%;background:var(--terracotta);color:var(--navy);
    display:flex;align-items:center;justify-content:center;font-weight:700;font-size:11px;flex-shrink:0;}
  .assistant-note .atext{font-size:12.5px;line-height:1.45;}

  /* ---------- CRM push banner: the microsite reacting to something that happened without the student acting ---------- */
  .crm-banner{position:absolute;top:12px;left:12px;right:12px;background:var(--navy);color:#fff;border-radius:14px;
    padding:11px 14px;display:flex;align-items:center;gap:10px;z-index:70;box-shadow:0 12px 24px -10px rgba(0,0,0,0.4);
    transform:translateY(-140%);transition:transform .35s cubic-bezier(.34,1.15,.64,1);}
  .crm-banner.show{transform:translateY(0);}
  .crm-banner .cicon{width:26px;height:26px;border-radius:50%;background:var(--terracotta);flex-shrink:0;display:flex;
    align-items:center;justify-content:center;font-size:12px;}
  .crm-banner .ctext{font-size:11.5px;line-height:1.35;}
  .crm-banner .ctext b{display:block;font-size:10px;color:var(--terracotta);text-transform:uppercase;letter-spacing:0.04em;}

  /* ---------- social-pull card: content that reads as sourced live, not authored into the page ---------- */
  .social-card{border:1px solid var(--line);border-radius:16px;overflow:hidden;margin-bottom:16px;}
  .social-head{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--line);}
  .social-head .shandle{font-size:11.5px;font-weight:700;}
  .social-head .ssource{font-size:9.5px;color:var(--sage);margin-left:auto;background:var(--paper-2);padding:3px 8px;border-radius:999px;}
  .social-photo{width:100%;aspect-ratio:1;background:linear-gradient(135deg,#c15b8e,#8a3b60);}
  .social-caption{padding:10px 12px;font-size:11.5px;line-height:1.4;color:var(--ink);}
</style>
</head>

<script>
  const STAGES = ['anonymous','interested','interview','applying','submitted','enrolled','onboarding'];
  const STAGE_LABEL = {
    anonymous: 'Just browsing',
    interested: 'Interested',
    interview: 'Interview complete',

    submitted: 'Application submitted',

  let state = {

  function toggleAcc(el){

  function accordion(id, title, body){
    return `<div class="acc" id="${id}">

    interested: ()=>`

    document.getElementById('callHandoff').addEventListener('click', triggerHandoff);
    document.getElementById('messagesCallBtn').addEventListener('click', triggerHandoff);
    document.getElementById('msgDot').style.display = 'none';
    state.unreadMessages = false;
  }

  function triggerHandoff(){
    pushChatRaw('handoff', 'Connecting you to a real admissions advisor — average wait under 2 minutes.');
  }

  function renderChatHistory(){
    const box = document.getElementById('chatMsgs');
    if(!box) return;
    box.innerHTML = '';
    state.chatHistory.forEach(m=>{
      const div = document.createElement('div');
      div.className = 'cmsg ' + m.role;
      div.textContent = m.text;
      box.appendChild(div);
    });
    box.scrollTop = box.scrollHeight;
  }

  function pushChatRaw(role, text){
    state.chatHistory.push({role, text});
    if(document.getElementById('chatMsgs')) renderChatHistory();
    if(document.getElementById('popupMsgs')) renderPopupChat();
    const popupOpen = document.getElementById('chatPopup') && document.getElementById('chatPopup').classList.contains('open');
    if(!popupOpen && state.activeTab !== 'messages'){
      const dot = document.getElementById('fabDot');
      if(dot) dot.classList.add('show');
    }
    if(state.activeTab === 'resources'){
      const dot = document.getElementById('msgDot');
      if(dot) dot.style.display = 'block';
      state.unreadMessages = true;
    }
  }

  function pushChat(role, text){ pushChatRaw(role, text); }

  // ---------- Tab dispatch ----------
  function switchTab(tab){
    state.activeTab = tab;
    document.querySelectorAll('.tab-btn').forEach(b=> b.classList.toggle('active', b.dataset.tab === tab));
    renderMainView();
  }

  function renderMainView(){
    const view = document.getElementById('mainView');
    if(state.activeTab === 'home'){
      view.innerHTML = renderHomeHTML();
      renderTeasers();
      renderOutputBlock();
    } else if(state.activeTab === 'resources'){
      view.innerHTML = renderResourcesHTML();
    }
    updateActionBar();
    view.scrollTop = 0;
  }

  function renderProgress(targetId){
    const row = document.getElementById(targetId || 'progressRow');
    if(!row) return;
    row.innerHTML = '';
    STAGES.forEach((s,i)=>{
      const seg = document.createElement('div');
      seg.className = 'progress-seg' + (i < state.stageIndex ? ' done' : i === state.stageIndex ? ' current' : '');
      seg.innerHTML = '<div class="fill"></div>';
      row.appendChild(seg);
    });
  }

  function crmPush(text, effect){
    const banner = document.getElementById('crmBanner');
    document.getElementById('crmBannerText').textContent = text;
    banner.classList.add('show');
    setTimeout(()=> banner.classList.remove('show'), 4200);
    state.crmFeed.push({text, time: 'Just now'});
    if(effect) effect();
  }

  function maybeTriggerCrmPush(){
    if(currentStage() === 'submitted' && !state.crmDocPushed){
      state.crmDocPushed = true;
      setTimeout(()=>{
        crmPush('Admissions verified your Photo ID on file from your interview — no upload needed for that one.', ()=>{
          state.docsUploaded = Math.max(state.docsUploaded, 1);
          renderDocList();
          updateActionBar();
        });
      }, 3200);
    }
    if(currentStage() === 'onboarding' && !state.meltNudgeSent){
      setTimeout(()=>{
        if(!state.orientationConfirmed){
          state.meltNudgeSent = true;
          crmPush('We noticed you have not confirmed orientation yet — everything okay?', ()=>{
            pushChatRaw('bot', "Hey — just checking in. I noticed you haven't confirmed orientation yet. Anything I can help with, or ready to lock it in?");
          });
        }
      }, 5000);
    }
  }

  const CALL_ICON_SVG = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M6.6 10.8C8.1 13.7 10.3 15.9 13.2 17.4L15.4 15.2C15.7 14.9 16.1 14.8 16.5 14.9C17.7 15.3 19 15.5 20.3 15.5C20.9 15.5 21.4 16 21.4 16.6V20.3C21.4 20.9 20.9 21.4 20.3 21.4C10.8 21.4 3 13.6 3 4.1C3 3.5 3.5 3 4.1 3H7.8C8.4 3 8.9 3.5 8.9 4.1C8.9 5.4 9.1 6.7 9.5 7.9C9.6 8.3 9.5 8.7 9.2 9L6.6 10.8Z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></svg>';

  function updateActionBar(){
    const stage = currentStage();
    let navLabel, fullLabel, disabled, sub;
    if(stage === 'anonymous'){
      navLabel = 'Start'; fullLabel = 'Get started'; disabled = false; sub = '';
    } else if(stage === 'interested'){
      navLabel = 'Book'; fullLabel = 'Book my interview'; disabled = !state.slotBooked;
      sub = state.slotBooked ? '' : 'Pick a time to continue';
    } else if(stage === 'interview'){
      navLabel = 'Apply'; fullLabel = 'Start my application'; disabled = false; sub = '';
    } else if(stage === 'applying'){
      navLabel = 'Submit'; fullLabel = 'Submit application'; disabled = !state.formValid;
      sub = state.formValid ? '' : 'Fill in every field';
    } else if(stage === 'submitted'){
      navLabel = 'Continue'; fullLabel = 'Continue'; disabled = state.docsUploaded < 1;
      sub = state.docsUploaded < 1 ? 'Upload a document first' : '';
    } else if(stage === 'enrolled'){
      navLabel = state.calendarAdded ? 'Added \u2713' : 'Calendar';
      fullLabel = state.calendarAdded ? 'Added to calendar \u2713' : 'Add to my calendar';
      disabled = state.calendarAdded; sub = '';
    } else if(stage === 'onboarding'){
      navLabel = state.orientationConfirmed ? 'Confirmed \u2713' : 'Confirm';
      fullLabel = state.orientationConfirmed ? 'Confirmed \u2713' : 'Confirm attendance';
      disabled = state.orientationConfirmed;
      sub = state.orientationConfirmed ? 'See you Sept 15th!' : '';
    }
    const navBtn = document.getElementById('actionBtn');
    const navLabelEl = document.getElementById('actionLabel');
    if(navBtn){ navBtn.disabled = disabled; }
    if(navLabelEl){ navLabelEl.textContent = navLabel; }

    document.querySelectorAll('.action-btn').forEach(b=>{ b.textContent = fullLabel; b.disabled = disabled; });
    document.querySelectorAll('.action-sub').forEach(s=>{ s.textContent = sub; });
    maybeTriggerCrmPush();
  }

  function pickSlot(el, label){
    document.querySelectorAll('#slotRow .slot-chip').forEach(c=>c.classList.remove('selected'));
    el.classList.add('selected');
    state.slotBooked = label;
    const confirm = document.getElementById('slotConfirm');
    confirm.textContent = `Booked: ${label} with Jasmine`;
    confirm.classList.add('show');
    updateActionBar();
  }

  function checkForm(){
    const name = document.getElementById('fName').value.trim();
    const email = document.getElementById('fEmail').value.trim();
    const start = document.getElementById('fStart').value;
    state.formValid = !!(name && email.includes('@') && start);
    state.studentName = name.split(' ')[0];
    updateActionBar();
  }

  function uploadDoc(){
    state.docsUploaded++;
    renderDocList();
    updateActionBar();
  }

  function renderDocList(){
    const el = document.getElementById('docList');
    if(!el) return;
    const docs = ['Photo ID','Enrollment agreement'];
    el.innerHTML = docs.map((d,i)=>`<div class="doc-row${i < state.docsUploaded ? ' received' : ''}"><div class="doc-dot"></div><div>${d}</div></div>`).join('');
  }

  function playVideo(card){
    card.querySelector('.vcaption span').textContent = 'Playing (placeholder) — swap in a real clip';
  }

  function onSliderScroll(el, dotsId){
    const idx = Math.round(el.scrollLeft / (el.firstElementChild.offsetWidth + 10));
    document.querySelectorAll('#'+dotsId+' .dot').forEach((d,i)=>d.classList.toggle('active', i===idx));
  }

  // ---------- persistent chat: real-time query resolution + human handoff ----------
  const CHAT_KB = {
    fees: "Tuition runs about $19,500 for the full program. FAFSA-eligible, with monthly payment plans available.",
    schedule: "Day and evening tracks are both available, so you can build a schedule around work or family.",
    placements: "91% of grads are placed within 6 months, mostly across salons and spas in IL, IN & WI.",
    licensing: "You'll sit for the state cosmetology board exam after graduating — the curriculum is built around it.",
    aid: "FAFSA grants plus industry scholarships are both available — Jasmine can check what you specifically qualify for."
  };
  const CHAT_CHIPS = [
    {l:'Tuition & fees', k:'fees'}, {l:'Class schedule', k:'schedule'},
    {l:'Job placement', k:'placements'}, {l:'Financial aid', k:'aid'}
  ];

  function detectChatIntent(text){
    const t = text.toLowerCase();
    if(/fee|tuition|cost|how much|pay/.test(t)) return 'fees';
    if(/schedule|day class|evening|hours|flexib/.test(t)) return 'schedule';
    if(/placement|placed|job|salon|career|hire/.test(t)) return 'placements';
    if(/licens|board exam|certif/.test(t)) return 'licensing';
    if(/aid|scholarship|fafsa|loan|grant/.test(t)) return 'aid';
    return null;
  }

  function renderChatChips(){
    const row = document.getElementById('chatQuick');
    row.innerHTML = '';
    CHAT_CHIPS.forEach(c=>{
      const btn = document.createElement('button');
      btn.className = 'qchip';
      btn.textContent = c.l;
      btn.onclick = ()=> sendChat(c.l, c.k);
      row.appendChild(btn);
    });
  }

  function sendChat(text, forcedIntent){
    pushChatRaw('user', text);
    const intent = forcedIntent || detectChatIntent(text);
    setTimeout(()=>{
      if(intent && CHAT_KB[intent]){
        pushChatRaw('bot', CHAT_KB[intent]);
        paintOutput(intent);
      } else {
        pushChatRaw('bot', "I'm not totally sure — try asking about tuition, schedule, job placement, or financial aid, or tap below to talk to a real person.");
      }
    }, 400);
  }

  document.addEventListener('click', e=>{
    if(e.target.closest && e.target.closest('#chatFab')){
      const popup = document.getElementById('chatPopup');
      popup.classList.add('open');
      document.getElementById('fabDot').classList.remove('show');
      renderPopupChat();
      return;
    }
    if(e.target.id === 'chatPopupClose'){
      document.getElementById('chatPopup').classList.remove('open');
      return;
    }
    if(e.target.closest && e.target.closest('#popupCallBtn')){
      triggerHandoff();
      renderPopupChat();
      return;
    }
    if(e.target.id === 'popupSend'){
      const input = document.getElementById('popupInput');
      const text = input.value.trim();
      if(!text) return;
      input.value = '';
      sendChat(text);
      return;
    }
    const primaryBtn = e.target.closest('.nav-cta-btn') || (e.target.classList.contains('action-btn') ? e.target : null);
    if(!primaryBtn || primaryBtn.disabled) return;
    const stage = currentStage();
    if(stage === 'enrolled'){
      state.calendarAdded = true;
      updateActionBar();
      return;
    }
    if(stage === 'onboarding'){
      state.orientationConfirmed = true;
      updateActionBar();
      crmPush('Orientation attendance confirmed — you are all set.');
      return;
    }
    if(state.stageIndex < STAGES.length - 1){
      state.stageIndex++;
      state.lastOutputKey = DEFAULT_OUTPUT_BY_STAGE[currentStage()];
      renderMainView();
    }
  });

  document.addEventListener('keydown', e=>{
    if(e.target.id === 'popupInput' && e.key === 'Enter'){
      document.getElementById('popupSend').click();
    }
  });

  state.lastOutputKey = DEFAULT_OUTPUT_BY_STAGE[currentStage()];
  renderMainView();
</script>

</body>
</html>
